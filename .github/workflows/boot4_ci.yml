name: boot4-ci
on:
  push:
    branches: [flex/boot4]
  pull_request:
    branches: [flex/boot4, 3.2.x]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        spring-boot: ["4.0.4", "4.1.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "21"
          cache: maven
      - name: build
        run: ./build.sh -Dspring.boot.version=${{ matrix.spring-boot }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-${{ matrix.spring-boot }}
          path: "**/target/surefire-reports/"
